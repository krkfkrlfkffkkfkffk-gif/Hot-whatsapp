# fly.toml app configuration file generated for hot-whatsapp on 2026-09-17T14:26:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hot-whatsapp'
primary_region = 'cdg'

[build]
  [build.args]
    GO_VERSION = '1.27.1'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
